version: "1.0"
name: "ECommerce → CRM"

options:
  nullPolicy: "skip"
  missingPolicy: "warn"

# 中间结果（设计文档 §6.8）：Phase 1.5 在 rules 前按声明序求值，$ 命名空间不进最终输出；
# 只能前向引用更早声明的暂存键。复杂转换先算中间值、再基于原始输入与中间值完成映射。
# 段落顺序即执行顺序：intermediate → rules → computed → defaults → validations。
intermediate:
  # 形态一（from + transform）：归一邮箱为小写
  - to: "$buyerEmail"
    from: "customer.email"
    transform: "lower"

  # 形态二（expr，跨字段组合）：买家标识 = 姓名 + 邮箱；串联引用 $buyerEmail（前向引用）
  - to: "$buyerLabel"
    expr: "customer.name.trim() + ' <' + $buyerEmail + '>'"

  # 形态二（expr，条件派生）：PAID 订单九折，其余原价
  - to: "$discountRate"
    expr: "status == 'PAID' ? 0.9 : 1.0"

rules:
  - from: "orderId"
    to: "crmOrder.id"

  - from: "customer.name"
    to: "crmOrder.buyer.name"
    transform: "trim"

  - from: "customer.email"
    to: "crmOrder.buyer.email"
    transform: "lower"

  - from: "customer.addresses[*].city"
    to: "crmOrder.buyer.cities[*]"

  - from: "items[*].sku"
    to: "crmOrder.lines[*].productCode"

  - from: "items[*].price"
    to: "crmOrder.lines[*].unitPrice"
    transform: "multiply(1.13) | round(2)"

  - from: "items[*].qty"
    to: "crmOrder.lines[*].quantity"

  - from: "status"
    to: "crmOrder.state"
    transform: "lower"

  - from: "orderDate"
    to: "crmOrder.orderDate"
    transform: "dateFormat('dd-MM-yyyy', 'yyyy-MM-dd')"

  - from: "createdAt"
    to: "crmOrder.createdAt"
    transform: "toIsoDateTime('yyyy/MM/dd HH:mm:ss')"

  - from: "createdAtEpoch"
    to: "crmOrder.eventTime"
    transform: "epochToIso('Asia/Shanghai')"

  # 中间结果参与映射：$buyerLabel 暂存值直接作为映射源
  - from: "$buyerLabel"
    to: "crmOrder.buyer.label"

  # transform 实参引用暂存：折后价 = 原价 × $discountRate（逐元素，[*] 索引对位）
  - from: "items[*].price"
    to: "crmOrder.lines[*].discountedPrice"
    transform: "multiply($discountRate) | round(2)"

computed:
  - to: "crmOrder.totalAmount"
    expr: "sum(crmOrder.lines[*].unitPrice * crmOrder.lines[*].quantity)"

defaults:
  - to: "crmOrder.currency"
    value: "CNY"
  - to: "crmOrder.source"
    value: "eCommerce"

validations:
  - path: "crmOrder.lines[*].unitPrice"
    rules:
      - assert: "gt(0)"
        message: "单价必须大于0"
  - path: "crmOrder.lines[*]"
    condition: "unitPrice > 0 && quantity > 0"
    message: "单价和数量必须同时大于0"
  - path: "crmOrder.buyer.email"
    rules:
      - assert: "regex('^[\\w.-]+@[\\w.-]+\\.\\w+$')"
        message: "邮箱格式非法"
  - path: "crmOrder.createdAt"
    rules:
      - assert: "dateAfter('2026-01-01')"
        message: "创建时间必须晚于2026-01-01"
      - assert: "dateNotAfter('2026-12-31')"
        message: "创建时间不能晚于2026-12-31"
