version: "1.0"
name: "ECommerce → CRM"

options:
  nullPolicy: "skip"
  missingPolicy: "warn"

rules:
  - from: "orderId"
    to: "crmOrder.id"

  - from: "customer.name"
    to: "crmOrder.buyer.name"
    transform: "trim"

  - from: "customer.email"
    to: "crmOrder.buyer.email"
    transform: "lower"

  - from: "customer.addresses[*].city"
    to: "crmOrder.buyer.cities[*]"

  - from: "items[*].sku"
    to: "crmOrder.lines[*].productCode"

  - from: "items[*].price"
    to: "crmOrder.lines[*].unitPrice"
    transform: "multiply(1.13) | round(2)"

  - from: "items[*].qty"
    to: "crmOrder.lines[*].quantity"

  - from: "status"
    to: "crmOrder.state"
    transform: "lower"

  - from: "orderDate"
    to: "crmOrder.orderDate"
    transform: "dateFormat('dd-MM-yyyy', 'yyyy-MM-dd')"

  - from: "createdAt"
    to: "crmOrder.createdAt"
    transform: "toIsoDateTime('yyyy/MM/dd HH:mm:ss')"

  - from: "createdAtEpoch"
    to: "crmOrder.eventTime"
    transform: "epochToIso('Asia/Shanghai')"

computed:
  - to: "crmOrder.totalAmount"
    expr: "sum(crmOrder.lines[*].unitPrice * crmOrder.lines[*].quantity)"

defaults:
  - to: "crmOrder.currency"
    value: "CNY"
  - to: "crmOrder.source"
    value: "eCommerce"

validations:
  - path: "crmOrder.lines[*].unitPrice"
    rules:
      - assert: "gt(0)"
        message: "单价必须大于0"
  - path: "crmOrder.lines[*]"
    condition: "unitPrice > 0 && quantity > 0"
    message: "单价和数量必须同时大于0"
  - path: "crmOrder.buyer.email"
    rules:
      - assert: "regex('^[\\w.-]+@[\\w.-]+\\.\\w+$')"
        message: "邮箱格式非法"
  - path: "crmOrder.createdAt"
    rules:
      - assert: "dateAfter('2026-01-01')"
        message: "创建时间必须晚于2026-01-01"
      - assert: "dateNotAfter('2026-12-31')"
        message: "创建时间不能晚于2026-12-31"
